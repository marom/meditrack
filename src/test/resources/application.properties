# Test-classpath overrides. The real datasource is supplied per-run by the
# Testcontainers MariaDB instance via @DynamicPropertySource (see
# com.marom.meditrack.support.MediTrackMariaDb). @WebMvcTest slices never build
# a datasource at all.
#
# ddl-auto=none on purpose: the schema is owned by db/meditrack_schema.sql, which
# the container loads on start. Reconciling entity/column types (e.g.
# feedback.rating TINYINT vs Integer) is a separate refactor task.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.sql.init.mode=never
spring.test.database.replace=none
