spring.application.name=meditrack

# Database. Credentials come from the environment; the schema is owned by
# db/meditrack_schema.sql and Hibernate only validates against it at boot.
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/meditrack_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

server.port=8080
