services:
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: meditrack_db
    ports:
      # Host 3307 to avoid colliding with a local MariaDB/MySQL on 3306; the app
      # still reaches this container as mariadb:3306 over the compose network.
      - "3307:3306"
    volumes:
      # meditrack_schema.sql drops/recreates meditrack_db and seeds reference data.
      # Runs only on first init (empty data dir); `docker compose down -v` to reset.
      - ./db/meditrack_schema.sql:/docker-entrypoint-initdb.d/01-meditrack_schema.sql:ro
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/meditrack_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    ports:
      - "8080:8080"

volumes:
  mariadb-data:
