services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: meditrack_db
    ports:
      # Host 3307 to avoid colliding with a local MySQL on 3306; the app
      # still reaches this container as mysql:3306 over the compose network.
      - "3307:3306"
    volumes:
      # meditrack_schema.sql drops/recreates meditrack_db and seeds reference data.
      # Runs only on first init (empty data dir); `docker compose down -v` to reset.
      - ./db/meditrack_schema.sql:/docker-entrypoint-initdb.d/01-meditrack_schema.sql:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/meditrack_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    ports:
      - "8080:8080"

volumes:
  mysql-data:
